# MaceSMP Core Shop
#
# direct-items: buyable icons placed straight on the main /coreshop menu -
# one click buys, no sub-menu. "slot" is the position (0-53, top-left to
# bottom-right, 9 per row). categories: (see the docs comment further down)
# still exist for anything you want grouped behind a sub-menu instead.
#
# Per item:
#   material  - Bukkit Material name
#   name      - display name (& color codes). Rename any time, purely cosmetic.
#   lore      - list of lore lines. {price} and {icon} are auto-replaced.
#   price     - cost in Cores. Left at 0 - set your own prices.
#   amount    - how many the buyer receives per purchase
#   slot      - required for direct-items: which slot it sits in (0-53)
#   enchant   - OPTIONAL, "key:level" comma-separated for multiple, e.g.
#               "sharpness:5,unbreaking:3". Real applied enchant, not cosmetic -
#               on an ENCHANTED_BOOK it becomes a genuine stored enchant.
#   command   - OPTIONAL. Runs this console command instead of giving the item.
#               {player} = buyer's name. Leave it out to just hand over the item.

direct-items:

  - material: ENCHANTED_BOOK
    name: "&b&lWind Burst I Book"
    lore:
      - "&7An enchanted book containing"
      - "&7&oWind Burst I&r&7."
      - ""
      - "&ePrice: &b{price} {icon} Cores"
    price: 0
    amount: 1
    enchant: "wind_burst:1"
    slot: 22

  - material: RED_CANDLE
    name: "&c&lRed Key"
    lore: ["&7A Red crate key.", "", "&ePrice: &b{price} {icon} Cores"]
    price: 0
